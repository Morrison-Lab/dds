<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Page not found</title>
<script>
  // GitHub Pages serves this file for any missing path under the site.
  // A path inside a PR preview whose directory has been removed (the PR
  // closed) goes to the same page on the main published site. A missing page
  // inside a preview that still exists stays a 404.
  (function () {
    var m = location.pathname.match(/^(\/[^\/]+)\/pr-preview\/(pr-\d+)(\/.*)?$/);
    if (!m) return;
    var target = m[1] + (m[3] || "/") + location.search + location.hash;
    // Every preview has a root index.html (Quarto's redirect to
    // chapters/index.html), so its absence means the preview was removed.
    fetch(m[1] + "/pr-preview/" + m[2] + "/index.html", { method: "HEAD" })
      .then(function (r) { if (r.status === 404) location.replace(target); })
      .catch(function () { location.replace(target); });
  })();
</script>
</head>
<body>
<p>Page not found. The CSCI 481 notes start at <a href="/dds/">the home page</a>.</p>
</body>
</html>
