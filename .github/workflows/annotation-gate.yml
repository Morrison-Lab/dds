# Gates every finished workflow run: any CI annotation fails it unless allowlisted (gha#1099).
# For a repository whose checks are spread over many workflow files: this
# gates each run that finishes and posts an `annotation-gate` check run on the
# commit, so it shows on the pull request. Add that check to the repository
# ruleset as required. With `all-runs` it gates the latest completed run of
# every workflow on the commit and posts one check run of that name.
name: Annotation gate

on: # zizmor: ignore[dangerous-triggers] -- the gate checks out nothing and runs no code from the triggering run
  workflow_run:
    workflows: ["*"]
    types: [completed]
  workflow_dispatch:
    inputs:
      head-sha:
        description: >-
          Commit to gate again, with no new commit and no re-run of any other
          workflow. Use it when a gate failure has been fixed upstream, or when
          a pull request touches only files no workflow watches (gha#1610).
        required: true
        type: string

# One gate per commit: a newer completion on the same commit replaces the gate
# waiting behind the running one, which `all-runs` makes redundant because it
# re-checks every workflow's latest run on the commit (sds#553). A running gate
# is not cancelled: with `cancel-in-progress: true`, completions arriving every
# few seconds cancelled each gate job before its first step (gha#1649).
# A gate run's own completion also starts a run of this workflow, whose job
# is skipped (see `if:` below). That run gets a group of its own, keyed on its
# run id: in the commit's group it would replace the real gate waiting behind
# the running one, and the commit could go ungated (gha#1403).
concurrency:
  group: ${{ github.event.workflow_run.name == 'Annotation gate' && format('annotation-gate-self-{0}', github.run_id) || format('annotation-gate-{0}', github.event.workflow_run.head_sha || inputs.head-sha) }}
  cancel-in-progress: false

jobs:
  gate:
    # The gate's own run must not trigger another gate.
    if: ${{ github.event.workflow_run.name != 'Annotation gate' }}
    permissions:
      actions: read
      checks: write
      contents: read
    uses: Morrison-Lab/gha/.github/workflows/annotation-gate-run.yml@v3
    with:
      run-id: ${{ github.event.workflow_run.id }}
      run-attempt: ${{ github.event.workflow_run.run_attempt }}
      head-sha: ${{ github.event.workflow_run.head_sha || inputs.head-sha }}
      all-runs: true
      # Tracked exception (gha#1103): the only submodule, Morrison-Lab/macros,
      # is public, so the review workflow's anonymous-clone notice is harmless.
      # Remove this if a private submodule is ever added.
      allow-patterns: |
        SUBMODULES_TOKEN is empty; cloning submodules anonymously
    #   levels: 'warning,failure'              # skip notices
