# Thin caller of Morrison-Lab/gha's reusable gitleaks history scan. Ported
# from d-morrison/rme.
#
# History rather than the diff: a secret committed and later removed is still
# exposed, because the orphaned commit stays fetchable through the GitHub API.
# That holds whether or not the repository is public: this one is private and
# staying private, and a leaked credential is still a leaked credential to
# everyone with access.
#
# Baseline measured 2026-09-23 with gitleaks 8.30.1 (the version the reusable
# workflow pins) over `main` plus the then-open PR branches: no leaks found,
# in under a second. So this runs with the default `fail: true`.
#
# rme runs this only on push and on a schedule, because its scan takes ten
# minutes. The 2026-09-23 baseline took a second here; by 2026-10-12 the full
# scan took about 3.6 minutes (the checkout is 18 seconds of that), and it ran
# on every push to every open PR. So a pull request scans only the commits it
# adds, `base..head`, which also covers a secret added and removed within the
# PR. Every push to `main` and the weekly run still scan the full history of
# every branch but `gh-pages` (see `log-opts` below); a secret is caught at the
# PR or at the next push to `main`.
name: Check for secrets

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Mondays, 08:00 UTC.
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  check:
    permissions:
      contents: read
    uses: Morrison-Lab/gha/.github/workflows/check-secrets.yml@v2
    with:
      # A pull request scans only its own commits. The SHAs are the PR's own
      # commit ids, not user-supplied text. Every other run scans every ref
      # except gh-pages: that branch holds the rendered site, one commit per
      # deploy (553 on 2026-10-14), and is 726 MiB of the 750 MiB repository.
      # Scanning it took 8 minutes locally against 2.5 seconds for main, and
      # 11 to 20 minutes on the runner, which hit the job's 20-minute timeout.
      # It is built output from main, whose source the scan covers.
      log-opts: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '--full-history --exclude=refs/remotes/origin/gh-pages --all' }}
