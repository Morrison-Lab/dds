# Thin caller of Morrison-Lab/gha's reusable bibliography DOI check.
#
# Checks that each book and article in references.bib has a DOI that resolves
# and whose Crossref record matches the entry's title, authors and year.
name: Check bibliography DOIs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check-dois:
    permissions:
      contents: read
    uses: Morrison-Lab/gha/.github/workflows/check-bibliography-dois.yml@v2
    with:
      # Entries the check skips: books with no DOI in Crossref, and
      # poh2010wearable, whose publisher (IEEE) answers the check's request
      # with status 202 though the DOI is correct, and srivastava2014dropout,
      # a JMLR article (JMLR assigns no DOIs). Remove a key once its
      # entry gains a DOI the check can verify.
      exclude-keys: >-
        brown2014makeitstick goodfellow2016deep minsky1969perceptrons
        murphy2022pml poh2010wearable raschka2022mlpytorch
        srivastava2014dropout
