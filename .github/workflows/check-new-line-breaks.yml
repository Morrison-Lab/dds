# Thin caller of Morrison-Lab/gha's reusable semantic-line-break check.
# Ported from d-morrison/rme.
#
# Flags newly added prose lines that pack more than one sentence onto one
# source line. It is diff-scoped (it reads only the lines a PR adds), so the
# existing chapters, written before the convention, are not reflagged. There
# is no `push` or `workflow_dispatch` trigger: neither has a PR base to diff
# against, so the reusable workflow would skip having checked nothing.
#
# Blocking: a PR that adds a packed-sentence line fails this check. Ezra,
# 2026-09-26: findings should produce CI errors, not just warnings -- the
# diff-scoping already means this never holds an unrelated PR to the
# pre-convention chapters' unreflowed prose; only lines the PR itself adds
# are ever in scope.

name: Check new markdown lines for missing semantic breaks

on:
  pull_request:

jobs:
  check:
    permissions:
      contents: read
    uses: Morrison-Lab/gha/.github/workflows/check-new-line-breaks.yml@v3
    with:
      # Space-separated git pathspecs. The upstream default is `*.md` alone;
      # this site's prose lives in `.qmd`.
      globs: '*.md *.qmd'
      # `_extensions/` holds vendored Quarto extensions (#17).
      # `**`, not `*`: gha's matcher stops a single `*` at a `/`.
      paths-ignore: '_extensions/**,chapters/outtakes/**'
      fail: true
