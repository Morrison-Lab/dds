# Configuration for crate-ci/typos, run by .github/workflows/check-typos.yml.
#
# Each entry is a correctly spelled term that typos' corrections list reads
# as a misspelling. Add a term here only after checking it really is right.
[default.extend-words]
# numpy.arange, in a checker self-test.
arange = "arange"
# Quarto theorem crossref prefix (#thm-, @thm-), in AUTHORING.md and chapters.
thm = "thm"
# Publisher of Machine Learning with PyTorch and Scikit-Learn.
Packt = "Packt"
# Gam and InvGam, the gamma-distribution operators in the latex-macros submodule.
gam = "gam"
# Surnames of Yee-Whye Teh and Martin Raison, authors cited in references.bib.
Teh = "Teh"
Raison = "Raison"
# Surname of Jimmy Lei Ba, an author cited in references.bib.
ba = "ba"
